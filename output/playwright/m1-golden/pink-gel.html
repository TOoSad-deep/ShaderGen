<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>ShaderForge WebGL1 Renderer</title>
  <style>
    html, body { margin: 0; min-height: 100%; background: #eceff3; }
    body { display: grid; place-items: center; font-family: ui-monospace, monospace; }
    canvas { display: block; background: white; }
    #shader-status {
      position: fixed; left: 12px; bottom: 12px; margin: 0; padding: 6px 9px;
      color: #102030; background: rgba(255,255,255,.9); border-radius: 5px;
      font-size: 12px; box-shadow: 0 1px 6px rgba(0,0,0,.15);
    }
  </style>
</head>
<body>
<script>
(() => {
  const vertexSource = `attribute vec2 a_position;
varying vec2 v_uv;
void main() {
  v_uv = a_position * 0.5 + 0.5;
  gl_Position = vec4(a_position, 0.0, 1.0);
}`;

  function compileShader(gl, type, source) {
    const shader = gl.createShader(type);
    if (!shader) return { shader: null, success: false, log: "createShader failed" };
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    return {
      shader,
      success: Boolean(gl.getShaderParameter(shader, gl.COMPILE_STATUS)),
      log: gl.getShaderInfoLog(shader) || "",
    };
  }

  function metadata(gl) {
    const debugInfo = gl.getExtension("WEBGL_debug_renderer_info");
    return {
      glVersion: String(gl.getParameter(gl.VERSION) || ""),
      glslVersion: String(gl.getParameter(gl.SHADING_LANGUAGE_VERSION) || ""),
      glVendor: String(
        debugInfo ? gl.getParameter(debugInfo.UNMASKED_VENDOR_WEBGL) : gl.getParameter(gl.VENDOR)
      ),
      glRenderer: String(
        debugInfo ? gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER)
      ),
    };
  }

  function cleanup(gl, program, vertexShader, fragmentShader, buffer) {
    if (buffer) gl.deleteBuffer(buffer);
    if (program) gl.deleteProgram(program);
    if (vertexShader) gl.deleteShader(vertexShader);
    if (fragmentShader) gl.deleteShader(fragmentShader);
  }

  window.__renderShader = (payload) => {
    for (const oldCanvas of document.querySelectorAll("canvas")) oldCanvas.remove();

    const canvas = document.createElement("canvas");
    canvas.width = payload.width;
    canvas.height = payload.height;
    canvas.setAttribute("aria-label", "Shader render output");
    document.body.prepend(canvas);

    const gl = canvas.getContext("webgl", {
      alpha: false,
      antialias: false,
      depth: false,
      stencil: false,
      premultipliedAlpha: false,
      preserveDrawingBuffer: true,
      powerPreference: "low-power",
    });
    if (!gl) {
      return {
        success: false,
        vertexLog: "",
        fragmentLog: "",
        linkLog: "",
        drawError: "WebGL 1.0 unavailable",
        dataUrl: null,
        metadata: null,
      };
    }

    const environment = metadata(gl);
    const vertex = compileShader(gl, gl.VERTEX_SHADER, vertexSource);
    const fragment = compileShader(gl, gl.FRAGMENT_SHADER, payload.fragmentSource);
    let program = null;
    let linkLog = "";
    let drawError = null;
    let dataUrl = null;

    if (vertex.success && fragment.success && vertex.shader && fragment.shader) {
      program = gl.createProgram();
      if (!program) {
        drawError = "createProgram failed";
      } else {
        gl.attachShader(program, vertex.shader);
        gl.attachShader(program, fragment.shader);
        gl.linkProgram(program);
        linkLog = gl.getProgramInfoLog(program) || "";
        if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
          drawError = "program link failed";
        }
      }
    }

    let buffer = null;
    if (program && !drawError) {
      gl.useProgram(program);
      buffer = gl.createBuffer();
      if (!buffer) {
        drawError = "createBuffer failed";
      } else {
        gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
        gl.bufferData(
          gl.ARRAY_BUFFER,
          new Float32Array([-1, -1, 3, -1, -1, 3]),
          gl.STATIC_DRAW
        );
        const position = gl.getAttribLocation(program, "a_position");
        if (position < 0) {
          drawError = "a_position attribute unavailable";
        } else {
          gl.enableVertexAttribArray(position);
          gl.vertexAttribPointer(position, 2, gl.FLOAT, false, 0, 0);

          const resolution = gl.getUniformLocation(program, "u_resolution");
          if (resolution !== null) gl.uniform2f(resolution, payload.width, payload.height);
          const time = gl.getUniformLocation(program, "u_time");
          if (time !== null) gl.uniform1f(time, 0.0);

          gl.viewport(0, 0, payload.width, payload.height);
          gl.clearColor(1.0, 1.0, 1.0, 1.0);
          gl.clear(gl.COLOR_BUFFER_BIT);
          gl.getError();
          gl.drawArrays(gl.TRIANGLES, 0, 3);
          gl.finish();
          const errorCode = gl.getError();
          if (errorCode !== gl.NO_ERROR) {
            drawError = `WebGL draw error 0x${errorCode.toString(16)}`;
          } else {
            dataUrl = canvas.toDataURL("image/png");
          }
        }
      }
    }

    const success = Boolean(
      vertex.success && fragment.success && program && !drawError && dataUrl
    );
    cleanup(gl, program, vertex.shader, fragment.shader, buffer);
    return {
      success,
      vertexLog: vertex.log,
      fragmentLog: fragment.log,
      linkLog,
      drawError,
      dataUrl: success ? dataUrl : null,
      metadata: environment,
    };
  };
})();
</script>

<pre id="shader-status">rendering</pre>
<script>
window.addEventListener("load", () => {
  const result = window.__renderShader({"fragmentSource": "precision mediump float;\n\nvarying vec2 v_uv;\nuniform sampler2D u_image;\nuniform vec2 u_resolution;\nuniform float u_time;\n\nfloat gaussian(float value, float width) {\n    float scaled = value / width;\n    return exp(-scaled * scaled);\n}\n\nvoid main() {\n    float shortSide = min(u_resolution.x, u_resolution.y);\n    vec2 p = (gl_FragCoord.xy - 0.5 * u_resolution) / shortSide;\n\n    vec2 center = vec2(0.0, 0.0396);\n    float radius = 0.420;\n    vec2 q = p - center;\n    float radialDistance = length(q);\n    vec2 n = q / max(radialDistance, 0.00001);\n    vec2 discPosition = q / radius;\n    float normalizedRadius = radialDistance / radius;\n\n    float aa = 1.25 / shortSide;\n    float discMask = 1.0 - smoothstep(\n        radius - aa,\n        radius + aa,\n        radialDistance\n    );\n\n    vec3 color = vec3(0.9961);\n\n    vec2 shadowOffset = vec2(0.024, -0.055);\n    float shadowDistance = length(q - shadowOffset) - radius * 0.975;\n    float shadowBlur = gaussian(max(shadowDistance, 0.0), 0.075);\n    float shadowDirection = smoothstep(\n        -0.75,\n        0.75,\n        dot(n, normalize(vec2(0.68, -0.74)))\n    );\n    float outsideDisc = 1.0 - smoothstep(\n        radius - aa * 2.0,\n        radius + aa * 2.0,\n        radialDistance\n    );\n    float shadowAlpha = shadowBlur * (0.035 + 0.145 * shadowDirection);\n    shadowAlpha *= 1.0 - outsideDisc;\n    color = mix(color, vec3(0.945, 0.535, 0.685), shadowAlpha);\n\n    float gradientPosition = 0.48 + 0.15 * discPosition.x - 0.45 * discPosition.y;\n    float gradientMix = smoothstep(-0.06, 1.06, gradientPosition);\n    vec3 hotPink = vec3(0.9804, 0.1333, 0.3451);\n    vec3 palePink = vec3(1.0000, 0.9490, 0.9765);\n    vec3 body = mix(hotPink, palePink, gradientMix);\n\n    vec2 bloomPoint = discPosition - vec2(0.30, -0.42);\n    float lowerBloom = exp(-1.55 * dot(bloomPoint, bloomPoint));\n    body = mix(body, vec3(1.0, 0.982, 0.990), 0.04 * lowerBloom);\n\n    float darkSide = smoothstep(\n        -0.35,\n        0.82,\n        dot(n, normalize(vec2(-0.72, 0.69)))\n    );\n    float lightSide = smoothstep(\n        -0.55,\n        0.80,\n        dot(n, normalize(vec2(0.68, -0.74)))\n    );\n    vec3 rimColor = mix(\n        vec3(0.957, 0.620, 0.735),\n        vec3(0.855, 0.050, 0.235),\n        darkSide\n    );\n    rimColor = mix(rimColor, vec3(0.986, 0.690, 0.810), 0.42 * lightSide);\n\n    float outerRim = gaussian(normalizedRadius - 0.991, 0.012);\n    float innerRim = gaussian(normalizedRadius - 0.958, 0.031);\n    body = mix(body, rimColor, 0.76 * outerRim);\n    body = mix(body, rimColor, 0.15 * innerRim * (0.30 + 0.70 * darkSide));\n\n    float topLip = gaussian(normalizedRadius - 0.976, 0.010);\n    topLip *= smoothstep(\n        0.10,\n        0.90,\n        dot(n, normalize(vec2(-0.10, 0.995)))\n    );\n    body = mix(body, vec3(1.0, 0.91, 0.95), 0.40 * topLip);\n\n    vec2 upperLightDirection = normalize(vec2(-0.55, 0.835));\n    float upperLightAngle = dot(n, upperLightDirection);\n    float upperGlow = gaussian(normalizedRadius - 0.900, 0.070);\n    upperGlow *= smoothstep(0.82, 0.97, upperLightAngle);\n    float upperCore = gaussian(normalizedRadius - 0.910, 0.035);\n    upperCore *= smoothstep(0.90, 0.990, upperLightAngle);\n    body = mix(body, vec3(1.0, 0.91, 0.96), 0.48 * upperGlow);\n    body = mix(body, vec3(1.0), 0.98 * upperCore);\n\n    vec2 lowerLightDirection = normalize(vec2(0.66, -0.75));\n    float lowerLightAngle = dot(n, lowerLightDirection);\n    float lowerGlow = gaussian(normalizedRadius - 0.835, 0.095);\n    lowerGlow *= smoothstep(0.48, 0.92, lowerLightAngle);\n    float lowerCore = gaussian(normalizedRadius - 0.855, 0.036);\n    lowerCore *= smoothstep(0.58, 0.96, lowerLightAngle);\n    body = mix(body, vec3(1.0, 0.965, 0.982), 0.58 * lowerGlow);\n    body = mix(body, vec3(1.0), 0.86 * lowerCore);\n\n    color = mix(color, body, discMask);\n    gl_FragColor = vec4(color, 1.0);\n}\n", "width": 192, "height": 192});
  const publicResult = {
    success: result.success,
    vertexLog: result.vertexLog,
    fragmentLog: result.fragmentLog,
    linkLog: result.linkLog,
    drawError: result.drawError,
    metadata: result.metadata,
  };
  window.__shaderStatus = publicResult;
  document.body.dataset.shaderStatus = result.success ? "ready" : "failed";
  document.getElementById("shader-status").textContent =
    result.success ? "WebGL1 · ready" : `WebGL1 · failed · ${result.drawError || result.fragmentLog}`;
});
</script>
</body>
</html>
