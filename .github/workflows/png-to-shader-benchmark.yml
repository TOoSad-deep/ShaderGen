name: PNG to Shader Benchmark

permissions:
  contents: read

on:
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch:
    inputs:
      run_ai_on:
        description: Run the cost-bearing real-model benchmark
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ai-off-smoke:
    name: AI-off Renderer and Oracle Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          uv sync --frozen
          uv run playwright install --with-deps chromium
      - name: Run deterministic benchmark smoke
        run: make benchmark-ai-off
      - name: Upload AI-off evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: png-to-shader-ai-off-${{ github.run_id }}
          path: output/benchmarks/png-to-shader-v1/
          if-no-files-found: error
          retention-days: 14

  ai-on-benchmark:
    name: Cost-gated Real-model Benchmark
    if: ${{ vars.PNG_TO_SHADER_AI_BENCHMARK_ENABLED == 'true' || (github.event_name == 'workflow_dispatch' && inputs.run_ai_on) }}
    runs-on: ubuntu-latest
    env:
      DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
      SHADER_GEN_MODEL_NAME: ${{ vars.PNG_TO_SHADER_BENCHMARK_MODEL || 'dashscope:qwen3.7-plus' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          uv sync --frozen
          uv run playwright install --with-deps chromium
      - name: Run fixed balanced suite
        run: make benchmark-png-to-shader QUALITY_PRESET=balanced MODEL_CALL_BUDGET=80
      - name: Upload benchmark and blind-review package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: png-to-shader-ai-on-${{ github.run_id }}
          path: output/benchmarks/png-to-shader-v1/
          if-no-files-found: error
          retention-days: 30
