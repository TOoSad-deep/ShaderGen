schema_version: node_lab_benchmark_manifest_v1
suite_id: node_lab_ai_off_v1
repetitions: 1
warmups: 0
cases:
  - case_id: normalize_solid_circle
    target_type: capability
    capability_id: normalize-target
    profile: micro
    artifacts:
      - field: source_artifact_id
        path: ../../png_to_shader_v1/images/solid_circle.png
        kind: source_image
        content_type: image/png
        sha256: 7ed59045ada3434c126f70a60a079d75ebf461359e34165f6f56700c1d360ac8
    expect:
      outcome: success

  - case_id: measure_solid_circle
    target_type: capability
    capability_id: measure-target
    profile: micro
    artifacts:
      - field: reference_artifact_id
        path: ../../png_to_shader_v1/images/solid_circle.png
        kind: reference_png
        content_type: image/png
        sha256: 7ed59045ada3434c126f70a60a079d75ebf461359e34165f6f56700c1d360ac8
    expect:
      outcome: success
      values:
        /output/target_measurements/image_width: 192
        /output/target_measurements/image_height: 192

  - case_id: validate_golden_shader
    target_type: capability
    capability_id: validate-shader
    profile: micro
    artifacts:
      - field: shader_artifact_id
        path: ../../png_to_shader_v1/golden/pink_gel.frag
        kind: shader_source
        content_type: application/x-glsl
        sha256: 59d94e0ed168fd6b9f4b239ccc780e95877a7f178b94a96fabdcd8bbae1bd2a3
    expect:
      outcome: success
      values:
        /output/validation/valid: true

  - case_id: reject_texture_sampling
    target_type: capability
    capability_id: validate-shader
    profile: micro
    artifacts:
      - field: shader_artifact_id
        path: fixtures/invalid_texture.frag
        kind: shader_source
        content_type: application/x-glsl
        sha256: 040b124345188952e1afe3bf649311d3e514404d5e43b15270ca5ecb13577f19
    expect:
      outcome: rejected
      values:
        /output/validation/valid: false

  - case_id: render_golden_shader_cold
    target_type: capability
    capability_id: render-shader
    profile: renderer_cold
    inputs:
      width: 192
      height: 192
    artifacts:
      - field: shader_artifact_id
        path: ../../png_to_shader_v1/golden/pink_gel.frag
        kind: shader_source
        content_type: application/x-glsl
        sha256: 59d94e0ed168fd6b9f4b239ccc780e95877a7f178b94a96fabdcd8bbae1bd2a3
    expect:
      outcome: success
      values:
        /output/render/success: true
        /output/render/width: 192
        /output/render/height: 192

  - case_id: evaluate_identical_image
    target_type: capability
    capability_id: evaluate-render
    profile: micro
    artifacts:
      - field: reference_artifact_id
        path: ../../png_to_shader_v1/images/solid_circle.png
        kind: reference_png
        content_type: image/png
        sha256: 7ed59045ada3434c126f70a60a079d75ebf461359e34165f6f56700c1d360ac8
      - field: render_artifact_id
        path: ../../png_to_shader_v1/images/solid_circle.png
        kind: render_png
        content_type: image/png
        sha256: 7ed59045ada3434c126f70a60a079d75ebf461359e34165f6f56700c1d360ac8
    expect:
      outcome: success
      values:
        /output/score/total_loss: 0.0

  - case_id: select_first_valid_candidate
    target_type: capability
    capability_id: select-current-best
    profile: micro
    inputs:
      candidate:
        candidate_id: candidate-1
        parent_candidate_id: null
        glsl_sha256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        glsl_ref: artifact:shader
        author_ref: artifact:author
        provenance_ref: artifact:provenance
        compile_ref: artifact:compile
        render_ref: artifact:render
        render_sha256: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
        metrics_ref: artifact:metrics
        review_ref: null
        iteration: 0
        changed_problem_domain: initial_build
        prompt_version: fixture-v1
        model_ref: fixture:none
        score_summary:
          metric_version: basic_oracle_v1
          total_loss: 0.2
          global_rmse: 0.2
          global_mae: 0.2
          edge_loss: 0.2
          geometry_loss: 0.2
          representative_pixel_loss: 0.2
          roi_losses: {subject: 0.2}
          protected_region_losses: {center: 0.1}
          effective_weights: {global_rmse: 1.0}
          diagnostics: []
        hard_constraints_passed: true
    expect:
      outcome: success
      values:
        /output/decision/accepted: true
        /output/decision/reason: first_valid_candidate

  - case_id: route_successful_render
    target_type: node
    node_id: decide_after_render
    profile: node
    inputs:
      render_status: success
      budget_policy:
        max_visual_refinements: 2
        max_compile_repairs: 2
        max_model_calls: 8
        max_wall_time_seconds: 300
    expect:
      outcome: success
      values:
        /output/next_action: select
