schema_version: node_lab_benchmark_manifest_v1
pipeline_id: png_to_shader_v1
suite_id: node_lab_scenario_ai_off_v1
repetitions: 1
warmups: 0
renderer_lifecycle: cold_per_attempt
cases:
  - case_id: pink_gel_fact_layer_scenario
    target_type: scenario
    profile: scenario
    artifacts:
      - step_id: normalize
        field: source_artifact_id
        path: ../../png_to_shader_v1/images/pink_gel.png
        kind: source_image
        content_type: image/png
        sha256: 5f182a927055e607dc85261c7d035d45fe5cef4081f833a71858dbcafe184140
      - step_id: validate
        field: shader_artifact_id
        path: ../../png_to_shader_v1/golden/pink_gel.frag
        kind: shader_source
        content_type: application/x-glsl
        sha256: 59d94e0ed168fd6b9f4b239ccc780e95877a7f178b94a96fabdcd8bbae1bd2a3
      - step_id: render
        field: shader_artifact_id
        path: ../../png_to_shader_v1/golden/pink_gel.frag
        kind: shader_source
        content_type: application/x-glsl
        sha256: 59d94e0ed168fd6b9f4b239ccc780e95877a7f178b94a96fabdcd8bbae1bd2a3
    steps:
      - step_id: normalize
        capability_id: normalize-target
        expect:
          outcome: success

      - step_id: measure
        capability_id: measure-target
        bindings:
          - field: reference_artifact_id
            source_step_id: normalize
            json_pointer: /output/normalized_artifact/artifact_id
        expect:
          outcome: success
          values:
            /output/target_measurements/image_width: 192
            /output/target_measurements/image_height: 192

      - step_id: validate
        capability_id: validate-shader
        expect:
          outcome: success
          values:
            /output/validation/valid: true

      - step_id: render
        capability_id: render-shader
        inputs:
          width: 192
          height: 192
        expect:
          outcome: success
          values:
            /output/render/success: true

      - step_id: evaluate
        capability_id: evaluate-render
        bindings:
          - field: reference_artifact_id
            source_step_id: normalize
            json_pointer: /output/normalized_artifact/artifact_id
          - field: render_artifact_id
            source_step_id: render
            json_pointer: /output/render_artifact/artifact_id
        expect:
          outcome: success
          values:
            /output/score/metric_version: basic_oracle_v1

  - case_id: deterministic_run_lifecycle_pipeline
    target_type: pipeline
    profile: pipeline
    artifacts:
      - step_id: initialize
        field: source_artifact_id
        path: ../../png_to_shader_v1/images/pink_gel.png
        kind: source_image
        content_type: image/png
        sha256: 5f182a927055e607dc85261c7d035d45fe5cef4081f833a71858dbcafe184140
    steps:
      - step_id: initialize
        node_id: initialize_run
        inputs:
          project_id: node-lab-pipeline
          quality_preset: balanced
          instruction: 固定 AI-off lifecycle benchmark
        expect:
          outcome: success
          values:
            /output/phase: initialized

      - step_id: measure
        node_id: measure_target
        base_step_id: initialize
        expect:
          outcome: success
          values:
            /output/target_measurements/image_width: 192
            /output/target_measurements/image_height: 192

      - step_id: prepare_context
        node_id: prepare_context
        base_step_id: measure
        expect:
          outcome: success
          values:
            /output/context_summary/selected_count: 0

      - step_id: finalize_empty_branch
        node_id: finalize
        base_step_id: measure
        expect:
          outcome: stopped
          values:
            /output/phase: finalized
            /output/final_result/success: false
