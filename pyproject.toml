[project]
name = "shadergen"
version = "0.0.1"
description = "图片到 WebGL1 Shader 的 Layered Direct 单仓应用。"
authors = [
    { name = "William Fu-Hinthorn", email = "13333726+hinthornw@users.noreply.github.com" },
]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "asyncpg>=0.31.0",
    "fastapi>=0.139.0",
    "langchain",
    "langchain-openai>=1.3.3",
    "numpy>=2.2.6",
    "pillow>=12.3.0",
    "playwright>=1.61.0",
    "python-dotenv>=1.0.1",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = ["mypy>=1.13.0", "ruff>=0.8.2"]

[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "agent",
    "agent.app",
    "agent.app.config",
    "agent.app.contracts",
    "agent.app.llms",
    "agent.app.llms.families",
    "agent.app.messages",
    "agent.app.nodes",
    "agent.app.nodes.layered_direct",
    "agent.app.observability",
    "agent.app.prompts",
    "agent.app.services",
    "backend",
    "backend.app",
    "backend.app.api",
    "backend.app.api.routes",
    "backend.app.core",
    "backend.app.database",
    "backend.app.middleware",
    "backend.app.schemas",
    "backend.app.services",
    "backend.sql",
    "shaderforge",
    "shaderforge.config",
    "shaderforge.contracts",
    "shaderforge.evaluation",
    "shaderforge.layered_spec",
    "shaderforge.program_spec",
    "shaderforge.rendering",
    "shaderforge.validation",
    "shaderforge.store",
]
[tool.setuptools.package-dir]
"agent" = "src/agent"
"shaderforge" = "src/shaderforge"


[tool.setuptools.package-data]
"*" = ["py.typed"]
"agent.app.config" = ["*.yaml"]
"agent.app.prompts" = ["*.yaml"]
"backend.sql" = ["*.sql"]
"shaderforge.config" = ["*.yaml"]

[tool.ruff]
lint.select = [
    "E",    # pycodestyle 规则
    "F",    # pyflakes 规则
    "I",    # isort 规则
    "D",    # pydocstyle 规则
    "D401", # 文档字符串首行使用祈使语气
    "T201",
    "UP",
]
lint.ignore = [
    "UP006",
    "UP007",
    # 这里确实需要从 typing_extensions 导入。
    "UP035",
    # 放宽文档要求，不强制每个函数参数都写说明。
    "D417",
    "E501",
]
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "UP"]
"backend/app/core/settings.py" = ["D"]
"backend/app/services/engine_rollout.py" = ["D"]
"backend/app/services/engine_rollout_runtime.py" = ["D"]
"backend/app/services/shader.py" = ["D"]
"backend/app/services/shader_generation.py" = ["D"]
"src/agent/app/contracts/layer_plan.py" = ["D107"]
[tool.ruff.lint.pydocstyle]
convention = "google"

[dependency-groups]
dev = [
    "anyio>=4.7.0",
    "mypy>=1.13.0",
    "pytest>=9.0.3",
    "ruff>=0.8.2",
    "types-pyyaml>=6.0.12.20260518",
]
